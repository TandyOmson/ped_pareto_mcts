outdir: logs/test

gen_model:
  class_path: ped_pareto_mcts.gen_models.rnn.GRUNextTokenLM
  model_file: data/gen_models/rnn_test.pt
  vocab_file: data/gen_models/rnn_test_vocab.json

MCTS:
  class_path: ped_pareto_mcts.mcts.pareto_cycler.ParetoMCTSCycler
  max_gen_mols: 10
  exploration_const: 1.5
  maxlen: 30
  
objective_functions:
  logP:
    class_path: ped_pareto_mcts.objectives.rdkit.logpObjective
    kwargs: {}
  QED:
    class_path: ped_pareto_mcts.objectives.rdkit.qedObjective
    kwargs: {}
  TPSA:
    class_path: ped_pareto_mcts.objectives.rdkit.tpsaObjective
    kwargs: {}
  MolWt:
    class_path: ped_pareto_mcts.objectives.rdkit.molwtObjective
    kwargs: {}
  VinaScore:
    class_path: ped_pareto_mcts.objectives.smina_score.VinaScore
    kwargs:
      receptor_file: data/receptors/cb7.sdf
  ped:
    class_path: ped_pareto_mcts.objectives.ped.PairwiseEmbeddingDistance
    kwargs:
      encoder_file: /home/andyt/DProjects/Dself_sup_graph_learning/molecule_embedding_proj/data/models/test_model_pretrained_encoder.pt
      smiles_to_graph_file: /home/andyt/DProjects/Dself_sup_graph_learning/molecule_embedding_proj/data/datasets/example/hydros_minimal_smiles_to_graph.json
